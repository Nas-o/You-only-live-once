name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-windows-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot zip

      - name: Typecheck, core tests and web builds
        run: npm run verify

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android platform and build tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Package Linux x64
        run: npm run package:linux

      - name: Package Linux arm64
        run: npm run package:linux:arm64

      - name: Package Windows x64
        run: npm run package:windows:portable

      - name: Package Windows arm64
        run: npm run package:windows:portable:arm64

      - name: Package Android
        run: npm run package:android

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/linux/release/*.AppImage
            apps/linux/release/*.deb

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/windows/release/*-portable.zip

      - name: Upload Android assets
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/android/release/*.apk

  macos:
    runs-on: macos-14
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Package macOS x64 + arm64
        run: npm run package:macos

      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            apps/macos/release/*.dmg
            apps/macos/release/*.zip

  ios:
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build unsigned IPA
        run: npm run package:ios

      - name: Upload iOS asset
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: apps/ios/release/*.ipa

  release:
    needs: [linux-windows-android, macos, ios]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place assets into release directories
        run: |
          mkdir -p apps/linux/release apps/windows/release apps/android/release apps/macos/release apps/ios/release
          cp -v artifacts/linux/* apps/linux/release/ 2>/dev/null || true
          cp -v artifacts/windows/* apps/windows/release/ 2>/dev/null || true
          cp -v artifacts/android/* apps/android/release/ 2>/dev/null || true
          cp -v artifacts/macos/* apps/macos/release/ 2>/dev/null || true
          cp -v artifacts/ios/* apps/ios/release/ 2>/dev/null || true

      - name: Write checksums
        run: node scripts/checksums.mjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: YOLO ${{ github.ref_name }}
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
          files: |
            apps/linux/release/*.AppImage
            apps/linux/release/*.deb
            apps/windows/release/*-portable.zip
            apps/android/release/*.apk
            apps/macos/release/*.dmg
            apps/macos/release/*.zip
            apps/ios/release/*.ipa
            SHA256SUMS.txt
