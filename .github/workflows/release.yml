name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot zip

      - name: Typecheck, core tests and web builds
        run: npm run verify

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android platform and build tools
        run: |
          # GitHub 的 ubuntu runner 已预装 Android SDK；直接使用本机 sdkmanager，
          # 避免 setup-android action 在部分 runner 镜像上安装失败。
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Package Linux
        run: |
          set -o pipefail
          npm run package:linux 2>&1 | tee /tmp/package-linux.log

      - name: Show Linux packaging failure
        if: failure()
        run: tail -120 /tmp/package-linux.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Package Windows portable
        run: |
          set -o pipefail
          npm run package:windows:portable 2>&1 | tee /tmp/package-windows.log

      - name: Show Windows packaging failure
        if: failure()
        run: tail -120 /tmp/package-windows.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Package Android
        run: |
          set -o pipefail
          npm run package:android 2>&1 | tee /tmp/package-android.log

      - name: Show Android packaging failure
        if: failure()
        run: tail -120 /tmp/package-android.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Write checksums
        run: npm run checksums

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: YOLO ${{ github.ref_name }}
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
          files: |
            apps/linux/release/*.AppImage
            apps/linux/release/*.deb
            apps/windows/release/*-portable.zip
            apps/android/release/*.apk
            SHA256SUMS.txt
